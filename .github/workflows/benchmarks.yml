name: Benchmarks

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare performance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: 2

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Install benchstat
      run: go install golang.org/x/perf/cmd/benchstat@fd4a688df89207abdabe0a0cf5b2cd9ccfd376d2

    - name: Benchmark base revision
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        RESULT_FILE: ${{ runner.temp }}/base.txt
      run: |
        set -o pipefail
        git checkout --detach "$BASE_SHA"
        go test -run='^$' -bench=. -benchmem -benchtime=500ms -count=10 ./internal/... | tee "$RESULT_FILE"

    - name: Benchmark pull request revision
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        RESULT_FILE: ${{ runner.temp }}/pr.txt
      run: |
        set -o pipefail
        git checkout --detach "$HEAD_SHA"
        go test -run='^$' -bench=. -benchmem -benchtime=500ms -count=10 ./internal/... | tee "$RESULT_FILE"

    - name: Compare benchmark results
      env:
        BASE_RESULT: ${{ runner.temp }}/base.txt
        PR_RESULT: ${{ runner.temp }}/pr.txt
      run: |
        set -o pipefail
        {
          echo '## Performance comparison'
          echo
          echo 'Base and PR benchmarks ran ten times each on the same runner.'
          echo 'This check is informational while benchmark variance is calibrated.'
          echo
          echo '```text'
          benchstat "base=$BASE_RESULT" "pr=$PR_RESULT"
          echo '```'
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload raw benchmark results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: benchmark-results-${{ github.event.pull_request.number }}
        path: |
          ${{ runner.temp }}/base.txt
          ${{ runner.temp }}/pr.txt
        if-no-files-found: warn
        retention-days: 30
